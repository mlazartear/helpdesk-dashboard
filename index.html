<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helpdesk — Estadísticas de Tickets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; background: #f4f5f7; color: #1f2937; -webkit-font-smoothing: antialiased; }

.topbar { background: linear-gradient(135deg,#0b2559,#123a82); color: #fff; padding: 22px 28px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; box-shadow: 0 2px 10px rgba(16,24,40,.15); }
.topbar h1 { font-size: 20px; font-weight: 800; letter-spacing: -.3px; }
.topbar .sub { font-size: 12px; opacity: .75; margin-top: 2px; }
.topbar .spacer { flex: 1; }
.topbar .updated { font-size: 11px; opacity: .7; text-align: right; }

.controls { background: #fff; border-bottom: 1px solid #e8eaed; padding: 12px 28px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.controls label { font-size: 11px; color: #6b7280; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
.controls select, .controls input[type=file] { border: 1px solid #e2e4e9; border-radius: 8px; padding: 7px 10px; font-size: 12px; font-family: inherit; background: #fff; }
.controls .hint { font-size: 11px; color: #9ca3af; }
.btn { padding: 7px 15px; border-radius: 8px; border: 1px solid #e2e4e9; background: white; cursor: pointer; font-size: 12px; font-weight: 600; color: #374151; }
.btn:hover { background: #f6f7f9; }

main { max-width: 1280px; margin: 0 auto; padding: 24px 28px 60px; }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-bottom: 20px; }
.kpi-card { background: #fff; border-radius: 14px; padding: 18px 20px; box-shadow: 0 1px 3px rgba(16,24,40,.06); border: 1px solid #eef0f3; }
.kpi-card .icon { font-size: 20px; margin-bottom: 8px; }
.kpi-card .label { font-size: 11px; color: #6b7280; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
.kpi-card .value { font-size: 30px; font-weight: 800; color: #111827; line-height: 1; }
.kpi-card .value.accent { color: #059669; }
.kpi-card .foot { font-size: 11px; color: #9ca3af; margin-top: 6px; }

.grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

.panel { background: #fff; border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.06); border: 1px solid #eef0f3; overflow: hidden; }
.panel-head { background: #123a82; color: #fff; padding: 12px 18px; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.panel-body { padding: 20px; }

.bars-month { display: flex; align-items: flex-end; gap: 14px; height: 220px; padding-top: 10px; }
.bars-month .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; min-width: 0; }
.bars-month .stack { width: 100%; max-width: 46px; display: flex; flex-direction: column-reverse; border-radius: 6px 6px 0 0; overflow: hidden; }
.bars-month .seg { width: 100%; }
.bars-month .val { font-size: 12px; font-weight: 700; color: #111827; }
.bars-month .mlabel { font-size: 11px; color: #6b7280; font-weight: 600; text-align: center; }

.hbar-row { display: grid; grid-template-columns: 120px 1fr 34px; align-items: center; gap: 10px; margin-bottom: 12px; }
.hbar-row .name { font-size: 12px; font-weight: 600; color: #374151; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar-track { background: #f1f3f5; border-radius: 6px; height: 16px; overflow: hidden; }
.hbar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg,#2563eb,#60a5fa); }
.hbar-row .num { font-size: 12px; font-weight: 700; color: #111827; text-align: right; }

.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; font-size: 11px; color: #6b7280; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

table.pivot { width: 100%; border-collapse: collapse; font-size: 12px; }
table.pivot th, table.pivot td { padding: 8px 10px; text-align: right; border-bottom: 1px solid #f1f3f5; white-space: nowrap; }
table.pivot th:first-child, table.pivot td:first-child { text-align: left; position: sticky; left: 0; background: #fff; }
table.pivot thead th { background: #f8f9fb; color: #6b7280; font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: .3px; }
table.pivot tbody tr:hover { background: #fafbfd; }
table.pivot td.total, table.pivot th.total { font-weight: 800; color: #111827; background: #f8f9fb; }
.table-wrap { overflow-x: auto; }

.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 5px 12px; border-radius: 999px; background: #eff6ff; color: #2563eb; font-size: 11.5px; font-weight: 700; border: 1px solid #dbeafe; }

.empty { padding: 40px; text-align: center; color: #9ca3af; }
.empty b { color: #374151; }

.foot-note { font-size: 11px; color: #9ca3af; margin-top: 14px; line-height: 1.5; }

table.listado { width: 100%; border-collapse: collapse; font-size: 12px; }
table.listado th, table.listado td { padding: 9px 10px; text-align: left; border-bottom: 1px solid #f1f3f5; vertical-align: top; }
table.listado thead th { background: #f8f9fb; color: #6b7280; font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: .3px; white-space: nowrap; position: sticky; top: 0; }
table.listado thead th.sortable { cursor: pointer; user-select: none; }
table.listado thead th.sortable:hover { color: #2563eb; }
table.listado thead th.sort-activo { color: #123a82; }
table.listado thead th .sort-ind { font-size: 9px; }
table.listado tbody tr:hover { background: #fafbfd; }
table.listado td.id a { color: #2563eb; text-decoration: none; font-weight: 700; }
table.listado td.id a:hover { text-decoration: underline; }
table.listado td.titulo { max-width: 260px; }
table.listado td.descripcion { max-width: 320px; cursor: pointer; color: #4b5563; -webkit-line-clamp: 2; -webkit-box-orient: vertical; display: -webkit-box; overflow: hidden; }
table.listado td.descripcion.expandida { -webkit-line-clamp: unset; max-width: 420px; white-space: pre-wrap; background: #fafbfd; }
table.listado td.descripcion .sin-dato { color: #d1d5db; }
.badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 700; white-space: nowrap; }
.badge.estado-cerrado { background: #ecfdf5; color: #059669; }
.badge.estado-resuelto { background: #eff6ff; color: #2563eb; }
.badge.estado-en-curso { background: #fffbeb; color: #d97706; }
.badge.estado-en-espera { background: #fef2f2; color: #dc2626; }
.badge.estado-asignado { background: #f3f4f6; color: #4b5563; }
.badge.prioridad-alta { background: #fff7ed; color: #ea580c; }
.badge.prioridad-media { background: #fefce8; color: #ca8a04; }
.badge.prioridad-baja { background: #f0fdf4; color: #16a34a; }
.badge.prioridad-urgente { background: #fef2f2; color: #dc2626; }
.filter-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.filter-bar input[type=text] { flex: 1; min-width: 220px; border: 1px solid #e2e4e9; border-radius: 8px; padding: 8px 12px; font-size: 12px; font-family: inherit; }
.filter-bar input[type=text]:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
.filter-bar .count { font-size: 11px; color: #6b7280; white-space: nowrap; }
.table-scroll { max-height: 640px; overflow-y: auto; overflow-x: auto; border: 1px solid #f1f3f5; border-radius: 10px; }

.tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #e2e4e9; }
.tab-btn { padding: 10px 18px; border: none; background: transparent; font-family: inherit; font-size: 13px; font-weight: 700; color: #6b7280; cursor: pointer; border-bottom: 2.5px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; }
.tab-btn:hover { color: #2563eb; }
.tab-btn.active { color: #123a82; border-bottom-color: #123a82; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>📊 Soporte Técnico — Estadísticas de Tickets</h1>
    <div class="sub">Bandeja de Equipo · Soluciones AST · <span id="clienteExcluidoLbl"></span></div>
  </div>
  <div class="spacer"></div>
  <div class="updated" id="updatedLbl"></div>
</div>

<div class="controls">
  <label>Fuente</label>
  <span class="hint" id="fuenteLbl">helpdesk_data.json</span>
  <button class="btn" onclick="location.reload()">↻ Recargar</button>
  <span class="hint">Actualizar: exportar Excel en la bandeja → <code>python3 helpdesk_stats.py</code> → recargar esta página</span>
</div>

<main id="app">
  <div class="empty">Cargando…</div>
</main>

<script>
function esc(s) {
  return (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function cargar() {
  const app = document.getElementById('app');
  let data;
  try {
    const res = await fetch('helpdesk_data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    app.innerHTML = `<div class="empty">
      <b>No pude cargar helpdesk_data.json</b><br><br>
      Corré primero: <code>python3 helpdesk_stats.py</code><br>
      y serví esta carpeta con: <code>python3 -m http.server 8080</code><br><br>
      (${e.message})
    </div>`;
    return;
  }
  render(data);
}

function render(data) {
  document.getElementById('clienteExcluidoLbl').textContent = data.cliente_excluido
    ? `(excluye cliente "${data.cliente_excluido}")` : '';
  document.getElementById('updatedLbl').innerHTML =
    `Generado: ${new Date(data.generado).toLocaleString('es-AR')}<br>${data.total_tickets} tickets analizados`;

  const meses = data.meses;
  const clientes = data.clientes;
  const totalMes = meses.length ? meses[meses.length - 1] : null;
  const mesAnterior = meses.length > 1 ? meses[meses.length - 2] : null;
  const topCliente = clientes[0];
  const promedioMensual = meses.length ? (data.total_tickets / meses.length) : 0;

  const PALETA = ['#2563eb','#059669','#d97706','#dc2626','#7c3aed','#0891b2','#db2777','#65a30d','#9333ea'];
  const colorCliente = {};
  clientes.forEach((c, i) => colorCliente[c.nombre] = PALETA[i % PALETA.length]);

  const maxMes = Math.max(1, ...meses.map(m => m.total));
  const maxCliente = Math.max(1, ...clientes.map(c => c.total));

  const kpis = `
    <div class="kpi-row">
      <div class="kpi-card">
        <div class="icon">🎫</div>
        <div class="label">Total tickets</div>
        <div class="value">${data.total_tickets}</div>
        <div class="foot">en el período analizado</div>
      </div>
      <div class="kpi-card">
        <div class="icon">📅</div>
        <div class="label">${totalMes ? totalMes.etiqueta : '—'}</div>
        <div class="value accent">${totalMes ? totalMes.total : 0}</div>
        <div class="foot">${mesAnterior ? (totalMes.total - mesAnterior.total >= 0 ? '▲ +' : '▼ ') + (totalMes.total - mesAnterior.total) + ' vs ' + mesAnterior.etiqueta : 'último mes con datos'}</div>
      </div>
      <div class="kpi-card">
        <div class="icon">🏢</div>
        <div class="label">Cliente con más casos</div>
        <div class="value">${topCliente ? topCliente.total : 0}</div>
        <div class="foot">${topCliente ? topCliente.nombre : '—'}</div>
      </div>
      <div class="kpi-card">
        <div class="icon">📈</div>
        <div class="label">Promedio mensual</div>
        <div class="value">${promedioMensual.toFixed(1)}</div>
        <div class="foot">tickets / mes</div>
      </div>
    </div>
  `;

  const barsMonth = meses.map(m => {
    const porCliente = data.por_mes_cliente[m.clave] || {};
    const segs = Object.entries(porCliente)
      .sort((a,b) => b[1]-a[1])
      .map(([cli, val]) => {
        const h = (val / maxMes) * 180;
        return `<div class="seg" style="height:${h}px;background:${colorCliente[cli] || '#94a3b8'}" title="${cli}: ${val}"></div>`;
      }).join('');
    return `<div class="col">
      <div class="val">${m.total}</div>
      <div class="stack">${segs}</div>
      <div class="mlabel">${m.etiqueta.split(' ')[0].slice(0,3)}<br>${m.etiqueta.split(' ')[1]}</div>
    </div>`;
  }).join('');

  const legend = clientes.map(c =>
    `<span><span class="sw" style="background:${colorCliente[c.nombre]}"></span>${c.nombre}</span>`
  ).join('');

  const hbars = clientes.map(c => `
    <div class="hbar-row">
      <div class="name" title="${c.nombre}">${c.nombre}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${(c.total/maxCliente*100).toFixed(1)}%; background:${colorCliente[c.nombre]}"></div></div>
      <div class="num">${c.total}</div>
    </div>`).join('');

  const tipoChips = Object.entries(data.por_tipo).map(([tipo, n]) =>
    `<span class="chip">${tipo}: ${n}</span>`).join('');
  const estadoChips = Object.entries(data.por_estado).map(([estado, n]) =>
    `<span class="chip" style="background:#f0fdf4;color:#059669;border-color:#dcfce7">${estado}: ${n}</span>`).join('');

  const tipificaciones = Object.entries(data.por_tipificacion || {});
  const maxTipif = Math.max(1, ...tipificaciones.map(([, n]) => n));
  const colorTipif = {};
  tipificaciones.forEach(([cat], i) => colorTipif[cat] = PALETA[i % PALETA.length]);

  const tipifHbars = tipificaciones.map(([cat, n]) => `
    <div class="hbar-row">
      <div class="name" title="${cat}">${cat}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${(n/maxTipif*100).toFixed(1)}%; background:${colorTipif[cat]}"></div></div>
      <div class="num">${n}</div>
    </div>`).join('');

  const pivotTipifHead = `<th>Tipificación</th>` + clientes.map(c => `<th>${c.nombre}</th>`).join('') + `<th class="total">Total</th>`;
  const pivotTipifRows = tipificaciones.map(([cat, total]) => {
    const porCliente = (data.por_tipificacion_cliente || {})[cat] || {};
    const cells = clientes.map(c => {
      const v = porCliente[c.nombre] || 0;
      return `<td>${v || '—'}</td>`;
    }).join('');
    return `<tr><td>${cat}</td>${cells}<td class="total">${total}</td></tr>`;
  }).join('');
  const pivotTipifTotalRow = `<tr><td class="total">Total</td>` +
    clientes.map(c => `<td class="total">${c.total}</td>`).join('') +
    `<td class="total">${data.total_tickets}</td></tr>`;

  const pivotHead = `<th>Cliente</th>` + meses.map(m => `<th>${m.etiqueta}</th>`).join('') + `<th class="total">Total</th>`;
  const pivotRows = clientes.map(c => {
    const cells = meses.map(m => {
      const v = (data.por_mes_cliente[m.clave] || {})[c.nombre] || 0;
      return `<td>${v || '—'}</td>`;
    }).join('');
    return `<tr><td>${c.nombre}</td>${cells}<td class="total">${c.total}</td></tr>`;
  }).join('');
  const pivotTotalRow = `<tr><td class="total">Total</td>` +
    meses.map(m => `<td class="total">${m.total}</td>`).join('') +
    `<td class="total">${data.total_tickets}</td></tr>`;

  const slug = s => (s || '').toString().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

  const esc = s => (s == null ? '' : String(s))
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const fmtFecha = iso => {
    const d = new Date(iso);
    if (isNaN(d)) return iso || '—';
    return d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
  };

  const ticketsOrdenados = [...(data.tickets || [])].sort((a, b) => (b.creacion || '').localeCompare(a.creacion || ''));

  const filaTicket = t => `
    <tr>
      <td class="id"><a href="https://helpdesk.accusys.com.ar/tickets/${t.id}" target="_blank" rel="noopener">#${t.id}</a></td>
      <td>${esc(t.cliente)}</td>
      <td class="titulo">${esc(t.titulo)}</td>
      <td class="descripcion" onclick="this.classList.toggle('expandida')" title="Click para expandir/colapsar">${esc(t.descripcion) || '<span class="sin-dato">—</span>'}</td>
      <td>${esc(t.tipo)}</td>
      <td>${esc(t.tipificacion)}</td>
      <td>${esc(t.autor)}</td>
      <td><span class="badge prioridad-${slug(t.prioridad)}">${esc(t.prioridad)}</span></td>
      <td><span class="badge estado-${slug(t.estado)}">${esc(t.estado)}</span></td>
      <td>${fmtFecha(t.creacion)}</td>
    </tr>`;

  const listadoRows = ticketsOrdenados.map(filaTicket).join('');

  document.getElementById('app').innerHTML = `
    <div class="tabs">
      <button class="tab-btn active" data-tab="metricas">📊 Métricas generales</button>
      <button class="tab-btn" data-tab="tipificacion">🔧 Tipificación y listado</button>
      <button class="tab-btn" data-tab="implementacion">🚀 Implementación</button>
    </div>

    <div class="tab-panel active" id="tab-metricas">
      ${kpis}
      <div class="grid-2">
        <div class="panel">
          <div class="panel-head">📈 Casos creados por mes (por cliente)</div>
          <div class="panel-body">
            <div class="bars-month">${barsMonth || '<div class="empty">Sin datos</div>'}</div>
            <div class="legend">${legend}</div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head">🏢 Casos por cliente (total del período)</div>
          <div class="panel-body">${hbars || '<div class="empty">Sin datos</div>'}</div>
        </div>
      </div>

      <div class="grid-2">
        <div class="panel">
          <div class="panel-head">🗂️ Distribución por tipo</div>
          <div class="panel-body"><div class="chip-row">${tipoChips}</div></div>
        </div>
        <div class="panel">
          <div class="panel-head">🚦 Distribución por estado</div>
          <div class="panel-body"><div class="chip-row">${estadoChips}</div></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">📋 Detalle: ingresos por mes y cliente</div>
        <div class="panel-body table-wrap">
          <table class="pivot">
            <thead><tr>${pivotHead}</tr></thead>
            <tbody>${pivotRows}${pivotTotalRow}</tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="tab-tipificacion">
      <div class="panel">
        <div class="panel-head">🔧 Tipificación de errores</div>
        <div class="panel-body">
          ${tipifHbars || '<div class="empty">Sin datos</div>'}
          <div class="foot-note">Clasificación automática por palabras clave en el título del ticket (heurística, no es un campo del Helpdesk).</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">📋 Tipificación por cliente</div>
        <div class="panel-body table-wrap">
          <table class="pivot">
            <thead><tr>${pivotTipifHead}</tr></thead>
            <tbody>${pivotTipifRows}${pivotTipifTotalRow}</tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">🎫 Listado completo de tickets</div>
        <div class="panel-body">
          <div class="filter-bar">
            <input type="text" id="filtroTickets" placeholder="Buscar por título, descripción, cliente, autor, tipo, tipificación, estado…">
            <span class="count" id="filtroCount">${ticketsOrdenados.length} tickets</span>
          </div>
          <div class="table-scroll">
            <table class="listado">
              <thead><tr>
                <th class="sortable" data-campo="id">ID<span class="sort-ind"></span></th>
                <th class="sortable" data-campo="cliente">Cliente<span class="sort-ind"></span></th>
                <th class="sortable" data-campo="titulo">Título<span class="sort-ind"></span></th>
                <th>Descripción</th>
                <th class="sortable" data-campo="tipo">Tipo<span class="sort-ind"></span></th>
                <th class="sortable" data-campo="tipificacion">Tipificación<span class="sort-ind"></span></th>
                <th class="sortable" data-campo="autor">Autor<span class="sort-ind"></span></th>
                <th class="sortable" data-campo="prioridad">Prioridad<span class="sort-ind"></span></th>
                <th class="sortable" data-campo="estado">Estado<span class="sort-ind"></span></th>
                <th class="sortable" data-campo="creacion">Creación<span class="sort-ind"></span></th>
              </tr></thead>
              <tbody id="listadoBody">${listadoRows || '<tr><td colspan="10" class="empty">Sin tickets</td></tr>'}</tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="tab-implementacion">
      <div id="adoMount"><div class="empty">Cargando…</div></div>
    </div>
  `;

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  const filtroInput = document.getElementById('filtroTickets');
  const filtroCount = document.getElementById('filtroCount');
  const sortState = { campo: 'creacion', dir: 'desc' };

  const actualizarIndicadoresSort = () => {
    document.querySelectorAll('#tab-tipificacion th.sortable').forEach(th => {
      const ind = th.querySelector('.sort-ind');
      if (th.dataset.campo === sortState.campo) {
        th.classList.add('sort-activo');
        ind.textContent = sortState.dir === 'asc' ? ' ▲' : ' ▼';
      } else {
        th.classList.remove('sort-activo');
        ind.textContent = '';
      }
    });
  };

  const refrescarListado = () => {
    const q = slug(filtroInput.value).replace(/-/g, '');
    let visibles = ticketsOrdenados.filter(t => {
      if (!q) return true;
      const haystack = slug([t.id, t.cliente, t.titulo, t.descripcion, t.tipo, t.tipificacion, t.autor, t.prioridad, t.estado].join(' ')).replace(/-/g, '');
      return haystack.includes(q);
    });

    const { campo, dir } = sortState;
    const mult = dir === 'asc' ? 1 : -1;
    visibles = [...visibles].sort((a, b) => {
      let va = a[campo], vb = b[campo];
      if (campo === 'id') { va = Number(va) || 0; vb = Number(vb) || 0; return (va - vb) * mult; }
      va = (va || '').toString().toLowerCase();
      vb = (vb || '').toString().toLowerCase();
      return va.localeCompare(vb, 'es') * mult;
    });

    document.getElementById('listadoBody').innerHTML = visibles.map(filaTicket).join('') || '<tr><td colspan="10" class="empty">Sin resultados</td></tr>';
    filtroCount.textContent = q ? `${visibles.length} de ${ticketsOrdenados.length} tickets` : `${visibles.length} tickets`;
    actualizarIndicadoresSort();
  };

  filtroInput.addEventListener('input', refrescarListado);

  document.querySelectorAll('#tab-tipificacion th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const campo = th.dataset.campo;
      if (sortState.campo === campo) {
        sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
      } else {
        sortState.campo = campo;
        sortState.dir = 'asc';
      }
      refrescarListado();
    });
  });

  actualizarIndicadoresSort();

  initAdoTab();
}

// Pestaña "Implementación" — Azure DevOps
// ─────────────────────────────────────────────────────────
const ADO_CFG_KEY = 'helpdeskAdoCfg';
let adoCfg = {};
let adoInitDone = false;

function loadAdoCfg() {
  try { adoCfg = JSON.parse(localStorage.getItem(ADO_CFG_KEY) || '{}'); } catch (e) { adoCfg = {}; }
}

function saveAdoCfg() {
  const org = document.getElementById('adoOrg').value.trim();
  const project = document.getElementById('adoProject').value.trim();
  const pat = document.getElementById('adoPat').value.trim();
  const team = document.getElementById('adoTeam').value.trim();
  if (!org || !project || !pat) { alert('Organization, Project y PAT son obligatorios.'); return; }
  adoCfg = { org, project, team, maxItems: parseInt(document.getElementById('adoMax').value) || 500 };
  localStorage.setItem(ADO_CFG_KEY, JSON.stringify(adoCfg));
  // El PAT se guarda aparte, en sessionStorage (no persiste entre sesiones del navegador,
  // así el token queda menos tiempo expuesto en disco que si fuera localStorage).
  sessionStorage.setItem('helpdeskAdoPat', pat);
  cargarAdo();
}

function adoAuthHdr() {
  const pat = sessionStorage.getItem('helpdeskAdoPat') || '';
  return { 'Authorization': 'Basic ' + btoa(':' + pat), 'Content-Type': 'application/json' };
}
function adoBase() { return `https://dev.azure.com/${encodeURIComponent(adoCfg.org)}/${encodeURIComponent(adoCfg.project)}`; }

async function adoApiGet(url) {
  const r = await fetch(url, { headers: adoAuthHdr() });
  if (!r.ok) throw new Error(`GET ${url} → ${r.status}: ${(await r.text()).slice(0, 300)}`);
  return r.json();
}

function adoParseDate(str) {
  if (!str) return null;
  const m = String(str).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3], 12, 0, 0) : new Date(str);
}

async function adoFetchTeamAreaPaths(teamName) {
  if (!teamName) return [];
  try {
    const d = await adoApiGet(`${adoBase()}/${encodeURIComponent(teamName)}/_apis/work/teamsettings/teamfieldvalues?api-version=7.1`);
    return (d.values || []).map(v => ({ value: v.value, includeChildren: v.includeChildren }));
  } catch (e) { console.warn('No se pudieron obtener area paths del equipo:', e); return []; }
}

function adoBuildAreaFilter(areaPaths) {
  if (!areaPaths.length) return '';
  const clauses = areaPaths.map(ap => ap.includeChildren
    ? `[System.AreaPath] UNDER '${ap.value.replace(/'/g, "''")}'`
    : `[System.AreaPath] = '${ap.value.replace(/'/g, "''")}'`);
  return `AND (${clauses.join(' OR ')})`;
}

const ADO_CAMPO_CLIENTE = 'Custom.Cliente';
const ADO_WI_FIELDS = ['System.Id', 'System.Title', 'System.WorkItemType', 'System.State', 'System.CreatedDate', ADO_CAMPO_CLIENTE].join(',');

async function adoFetchItemsByIds(ids) {
  const raw = [];
  for (let i = 0; i < ids.length; i += 200) {
    const chunk = ids.slice(i, i + 200);
    const d = await adoApiGet(`${adoBase()}/_apis/wit/workitems?ids=${chunk.join(',')}&fields=${encodeURIComponent(ADO_WI_FIELDS)}&api-version=7.1`);
    raw.push(...(d.value || []));
  }
  return raw;
}

const ADO_TIPO_FILTRADO = 'Task de Implementación';

async function adoFetchWorkItems() {
  const areaPaths = await adoFetchTeamAreaPaths(adoCfg.team);
  const areaFilter = adoBuildAreaFilter(areaPaths);
  const maxItems = adoCfg.maxItems || 500;
  const wiql = { query: `SELECT [System.Id] FROM WorkItems WHERE [System.TeamProject] = @project AND [System.WorkItemType] = '${ADO_TIPO_FILTRADO.replace(/'/g, "''")}' AND [System.State] NOT IN ('Removed','Cut','Cancelled','Rejected','Withdrawn') ${areaFilter} ORDER BY [System.CreatedDate] DESC` };
  const r = await fetch(`${adoBase()}/_apis/wit/wiql?$top=${maxItems}&api-version=7.1`, {
    method: 'POST', headers: adoAuthHdr(), body: JSON.stringify(wiql)
  });
  if (!r.ok) throw new Error(`WIQL falló: ${r.status} ${await r.text()}`);
  const { workItems: wis } = await r.json();
  if (!wis?.length) return [];
  return adoFetchItemsByIds(wis.map(w => w.id));
}

const ADO_MESES_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

        <p class="foot-note" style="margin-top:0 0 14px">Los datos se guardan localmente en tu navegador (el PAT en sessionStorage, se borra al cerrar la pestaña del navegador). Nunca se suben a GitHub ni pasan por ningún servidor propio — solo se usan para llamar directo a la API de Azure DevOps.<br><br>Esta pestaña solo trae work items de tipo <b>"${esc(ADO_TIPO_FILTRADO)}"</b> (se excluye "Task de Análisis" y cualquier otro tipo).</p>
        <div class="filter-bar" style="flex-direction:column; align-items:stretch; gap:12px;">
          <div>
            <label style="font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px;">Organization</label>
            <input type="text" id="adoOrg" placeholder="accusystechnology" value="${esc(adoCfg.org || '')}" style="width:100%;padding:8px 12px;border:1px solid #e2e4e9;border-radius:8px;font-size:12px;font-family:inherit;">
          </div>
          <div>
            <label style="font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px;">Project</label>
            <input type="text" id="adoProject" placeholder="probatch" value="${esc(adoCfg.project || '')}" style="width:100%;padding:8px 12px;border:1px solid #e2e4e9;border-radius:8px;font-size:12px;font-family:inherit;">
          </div>
          <div>
            <label style="font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px;">Team (opcional — nombre exacto del equipo en ADO)</label>
            <input type="text" id="adoTeam" placeholder="ej: Implementación Team (vacío = todo el proyecto)" value="${esc(adoCfg.team || '')}" style="width:100%;padding:8px 12px;border:1px solid #e2e4e9;border-radius:8px;font-size:12px;font-family:inherit;">
          </div>
          <div>
            <label style="font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px;">Personal Access Token (PAT)</label>
            <input type="password" id="adoPat" placeholder="Permisos necesarios: Work Items (Read)" style="width:100%;padding:8px 12px;border:1px solid #e2e4e9;border-radius:8px;font-size:12px;font-family:inherit;">
          </div>
          <div>
            <label style="font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px;">Máx. work items</label>
            <input type="number" id="adoMax" value="${adoCfg.maxItems || 500}" style="width:100%;padding:8px 12px;border:1px solid #e2e4e9;border-radius:8px;font-size:12px;font-family:inherit;">
          </div>
          <button class="btn" style="background:#123a82;color:#fff;border-color:#123a82;" onclick="saveAdoCfg()">Guardar y conectar</button>
        </div>
      </div>
    </div>`;
}

function initAdoTab() {
  loadAdoCfg();
  const mount = document.getElementById('adoMount');
  if (!mount) return;
  if (adoCfg.org && adoCfg.project && sessionStorage.getItem('helpdeskAdoPat')) {
    cargarAdo();
  } else {
    mount.innerHTML = adoConfigForm();
  }
}

async function cargarAdo() {
  const mount = document.getElementById('adoMount');
  mount.innerHTML = '<div class="empty">Consultando Azure DevOps…</div>';
  let items;
  try {
    items = await adoFetchWorkItems();
  } catch (e) {
    mount.innerHTML = `<div class="panel"><div class="panel-body">
      <div class="empty"><b>No pude conectar con Azure DevOps</b><br><br>${esc(e.message)}</div>
      <button class="btn" onclick="reconfigurarAdo()">⚙️ Revisar configuración</button>
    </div></div>`;
    return;
  }
  renderAdo(items);
}

function reconfigurarAdo() {
  sessionStorage.removeItem('helpdeskAdoPat');
  document.getElementById('adoMount').innerHTML = adoConfigForm();
}

function renderAdo(items) {
  const mount = document.getElementById('adoMount');
  const ahora = new Date();
  const mesActualKey = `${ahora.getFullYear()}-${String(ahora.getMonth() + 1).padStart(2, '0')}`;

  const porMes = {};
  const porEstado = {};
  const porCliente = {};
  for (const it of items) {
    const f = it.fields || {};
    const fecha = adoParseDate(f['System.CreatedDate']);
    const estado = f['System.State'] || 'Sin estado';
    const cliente = (f[ADO_CAMPO_CLIENTE] || '').toString().trim() || 'Sin cliente';
    porEstado[estado] = (porEstado[estado] || 0) + 1;
    porCliente[cliente] = (porCliente[cliente] || 0) + 1;
    if (fecha) {
      const key = `${fecha.getFullYear()}-${String(fecha.getMonth() + 1).padStart(2, '0')}`;
      porMes[key] = (porMes[key] || 0) + 1;
    }
  }

  const mesesOrdenados = Object.keys(porMes).sort();
  const maxMes = Math.max(1, ...mesesOrdenados.map(m => porMes[m]));
  const barsMonth = mesesOrdenados.map(m => {
    const [y, mm] = m.split('-');
    const h = (porMes[m] / maxMes * 100).toFixed(1);
    return `<div class="col">
      <div class="val">${porMes[m]}</div>
      <div class="stack" style="height:${h}%"><div class="seg" style="height:100%;background:linear-gradient(180deg,#2563eb,#60a5fa)"></div></div>
      <div class="mlabel">${ADO_MESES_ES[parseInt(mm) - 1].slice(0,3)}<br>${y}</div>
    </div>`;
  }).join('');

  const estadoChips = Object.entries(porEstado).sort((a, b) => b[1] - a[1])
    .map(([estado, n]) => `<span class="chip">${esc(estado)}: ${n}</span>`).join('');
  const estadoTop = Object.entries(porEstado).sort((a, b) => b[1] - a[1])[0];

  const clientesOrdenados = Object.entries(porCliente).sort((a, b) => b[1] - a[1]);
  const maxCliente = Math.max(1, ...clientesOrdenados.map(([, n]) => n));
  const clienteHbars = clientesOrdenados.map(([cliente, n]) => `
    <div class="hbar-row">
      <div class="name" title="${esc(cliente)}">${esc(cliente)}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${(n/maxCliente*100).toFixed(1)}%"></div></div>
      <div class="num">${n}</div>
    </div>`).join('');
  const clienteVacio = clientesOrdenados.length === 1 && clientesOrdenados[0][0] === 'Sin cliente';

  mount.innerHTML = `
    <div class="kpi-row">
      <div class="kpi-card">
        <div class="icon">🚀</div>
        <div class="label">Total "${esc(ADO_TIPO_FILTRADO)}"</div>
        <div class="value">${items.length}</div>
        <div class="foot">en ${adoCfg.team ? `equipo "${esc(adoCfg.team)}"` : 'todo el proyecto'}</div>
      </div>
      <div class="kpi-card">
        <div class="icon">📅</div>
        <div class="label">${ADO_MESES_ES[ahora.getMonth()]} ${ahora.getFullYear()}</div>
        <div class="value accent">${porMes[mesActualKey] || 0}</div>
        <div class="foot">creados este mes</div>
      </div>
      <div class="kpi-card">
        <div class="icon">🚦</div>
        <div class="label">Estado más frecuente</div>
        <div class="value" style="font-size:18px">${esc(estadoTop?.[0] || '—')}</div>
        <div class="foot">${estadoTop?.[1] || 0} items</div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:16px">
      <div class="panel-head">📈 "${esc(ADO_TIPO_FILTRADO)}" creados por mes</div>
      <div class="panel-body">
        <div class="bars-month">${barsMonth || '<div class="empty">Sin datos</div>'}</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-head">🏢 Casos por cliente</div>
        <div class="panel-body">
          ${clienteHbars || '<div class="empty">Sin datos</div>'}
          ${clienteVacio ? `<div class="foot-note">No se encontró valor en el campo "${esc(ADO_CAMPO_CLIENTE)}" para ningún item. Puede que el nombre técnico del campo en tu proceso de ADO sea otro (no "${esc(ADO_CAMPO_CLIENTE)}") — avisame y lo ajusto.</div>` : ''}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">🚦 Distribución por estado</div>
        <div class="panel-body"><div class="chip-row">${estadoChips || '<div class="empty">Sin datos</div>'}</div></div>
      </div>
    </div>

    <div class="filter-bar">
      <button class="btn" onclick="cargarAdo()">↻ Recargar</button>
      <button class="btn" onclick="reconfigurarAdo()">⚙️ Reconfigurar</button>
      <span class="hint">Organization: ${esc(adoCfg.org)} · Project: ${esc(adoCfg.project)}${adoCfg.team ? ' · Team: ' + esc(adoCfg.team) : ''} · Tipo: ${esc(ADO_TIPO_FILTRADO)}</span>
    </div>
  `;
}

cargar();
